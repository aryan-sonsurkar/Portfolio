<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">GITHUB STATS</text>
  <text x="200" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">@aryan-sonsurkar</text>
  
  <!-- Stats Cards -->
  <g transform="translate(30, 80)">
    <!-- Contributions -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="20" y="30" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Contributions (2026)</text>
    <text x="20" y="70" font-family="Segoe UI, Arial" font-size="42" fill="#3fb950" font-weight="bold">333</text>
    <text x="20" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">and counting...</text>
    
    <!-- Repos -->
    <rect x="200" y="0" width="180" height="120" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="220" y="30" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Public Repos</text>
    <text x="220" y="70" font-family="Segoe UI, Arial" font-size="42" fill="#58a6ff" font-weight="bold">15+</text>
    <text x="220" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">across 7 languages</text>
    
    <!-- Stars -->
    <rect x="400" y="0" width="180" height="120" rx="8" fill="#21262d" stroke="#ffd700" stroke-width="2"/>
    <text x="420" y="30" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Stars Earned</text>
    <text x="420" y="70" font-family="Segoe UI, Arial" font-size="42" fill="#ffd700" font-weight="bold">10</text>
    <text x="420" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">self-starred projects</text>
    
    <!-- Languages -->
    <rect x="600" y="0" width="170" height="120" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-width="2"/>
    <text x="620" y="30" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Top Languages</text>
    <text x="620" y="55" font-family="Segoe UI, Arial" font-size="11" fill="#3572A5">■ Python</text>
    <text x="620" y="72" font-family="Segoe UI, Arial" font-size="11" fill="#f1e05a">■ JavaScript</text>
    <text x="620" y="89" font-family="Segoe UI, Arial" font-size="11" fill="#3178c6">■ TypeScript</text>
    <text x="620" y="106" font-family="Segoe UI, Arial" font-size="11" fill="#555555">■ C</text>
  </g>
  
  <!-- Contribution Graph -->
  <rect x="30" y="220" width="740" height="260" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="250" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">Contribution Activity</text>
  
  <!-- Graph -->
  <g transform="translate(50, 270)">
    <!-- Months -->
    <text x="0" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Jan</text>
    <text x="60" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Feb</text>
    <text x="120" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Mar</text>
    <text x="180" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Apr</text>
    <text x="240" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">May</text>
    <text x="300" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Jun</text>
    <text x="360" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Jul</text>
    
    <!-- Activity bars -->
    <rect x="0" y="20" width="40" height="180" fill="#0e4429"/>
    <rect x="0" y="60" width="40" height="140" fill="#006d32"/>
    <rect x="0" y="100" width="40" height="100" fill="#26a641"/>
    <rect x="0" y="140" width="40" height="60" fill="#39d353"/>
    
    <rect x="60" y="40" width="40" height="160" fill="#0e4429"/>
    <rect x="60" y="80" width="40" height="120" fill="#006d32"/>
    <rect x="60" y="120" width="40" height="80" fill="#26a641"/>
    <rect x="60" y="160" width="40" height="40" fill="#39d353"/>
    
    <rect x="120" y="60" width="40" height="140" fill="#0e4429"/>
    <rect x="120" y="100" width="40" height="100" fill="#006d32"/>
    <rect x="120" y="140" width="40" height="60" fill="#26a641"/>
    <rect x="120" y="180" width="40" height="20" fill="#39d353"/>
    
    <rect x="180" y="80" width="40" height="120" fill="#0e4429"/>
    <rect x="180" y="120" width="40" height="80" fill="#006d32"/>
    <rect x="180" y="160" width="40" height="40" fill="#26a641"/>
    
    <rect x="240" y="100" width="40" height="100" fill="#0e4429"/>
    <rect x="240" y="140" width="40" height="60" fill="#006d32"/>
    <rect x="240" y="180" width="40" height="20" fill="#26a641"/>
    
    <rect x="300" y="120" width="40" height="80" fill="#0e4429"/>
    <rect x="300" y="160" width="40" height="40" fill="#006d32"/>
    
    <rect x="360" y="140" width="40" height="60" fill="#0e4429"/>
    <rect x="360" y="180" width="40" height="20" fill="#006d32"/>
    
    <!-- Legend -->
    <rect x="500" y="20" width="15" height="15" fill="#0e4429"/>
    <text x="520" y="32" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Less</text>
    
    <rect x="560" y="20" width="15" height="15" fill="#006d32"/>
    <rect x="600" y="20" width="15" height="15" fill="#26a641"/>
    <rect x="640" y="20" width="15" height="15" fill="#39d353"/>
    <text x="660" y="32" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">More</text>
    
    <!-- Stats -->
    <text x="500" y="60" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Current Streak: 14 days</text>
    <text x="500" y="80" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Longest Streak: 31 days</text>
    <text x="500" y="100" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Total Commits: 500+</text>
    <text x="500" y="120" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">PRs Opened: 12</text>
    <text x="500" y="140" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Issues Created: 8</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>