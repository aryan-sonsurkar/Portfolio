<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">MODCODES IDE · SHIPPED</text>
  <text x="330" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#3fb950">open-source · live · local Ollama models</text>

  <!-- Editor window -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="470" height="300" rx="8" fill="#21262d" stroke="#7c3aed" stroke-width="2"/>
    <!-- title bar -->
    <rect x="0" y="0" width="470" height="30" rx="8" fill="#2d1b4e"/>
    <circle cx="18" cy="15" r="5" fill="#f85149"/>
    <circle cx="36" cy="15" r="5" fill="#d29922"/>
    <circle cx="54" cy="15" r="5" fill="#3fb950"/>
    <text x="150" y="20" font-family="Segoe UI, Arial" font-size="12" fill="#d2a8ff">modcodes-ide — agent.py</text>

    <!-- sidebar -->
    <rect x="0" y="30" width="120" height="270" fill="#1a1a24"/>
    <text x="10" y="52" font-family="Consolas, monospace" font-size="11" fill="#8b949e">EXPLORER</text>
    <text x="10" y="76" font-family="Consolas, monospace" font-size="11" fill="#58a6ff">▸ src/</text>
    <text x="20" y="96" font-family="Consolas, monospace" font-size="11" fill="#8b949e">agent.py</text>
    <text x="20" y="116" font-family="Consolas, monospace" font-size="11" fill="#8b949e">ollama_client.py</text>
    <text x="20" y="136" font-family="Consolas, monospace" font-size="11" fill="#8b949e">editor.py</text>
    <text x="10" y="156" font-family="Consolas, monospace" font-size="11" fill="#58a6ff">▸ tools/</text>
    <text x="10" y="176" font-family="Consolas, monospace" font-size="11" fill="#8b949e">README.md</text>
    <text x="10" y="196" font-family="Consolas, monospace" font-size="11" fill="#8b949e">requirements.txt</text>

    <!-- code area -->
    <g font-family="Consolas, monospace" font-size="11">
      <text x="135" y="60" fill="#8b949e"> 1</text><text x="160" y="60" fill="#7c3aed">class</text><text x="200" y="60" fill="#f0f6fc">CodeAgent</text><text x="255" y="60" fill="#f0f6fc">:</text>
      <text x="135" y="80" fill="#8b949e"> 2</text><text x="160" y="80" fill="#f0f6fc">    </text><text x="175" y="80" fill="#7c3aed">def</text><text x="210" y="80" fill="#79c0ff">build</text><text x="245" y="80" fill="#f0f6fc">(self, task):</text>
      <text x="135" y="100" fill="#8b949e"> 3</text><text x="160" y="100" fill="#f0f6fc">        plan = self.</text><text x="255" y="100" fill="#79c0ff">plan</text><text x="285" y="100" fill="#f0f6fc">(task)</text>
      <text x="135" y="120" fill="#8b949e"> 4</text><text x="160" y="120" fill="#f0f6fc">        </text><text x="175" y="120" fill="#7ee787"># local model, no cloud</text>
      <text x="135" y="140" fill="#8b949e"> 5</text><text x="160" y="140" fill="#f0f6fc">        </text><text x="175" y="140" fill="#7c3aed">for</text><text x="210" y="140" fill="#f0f6fc"> step </text><text x="255" y="140" fill="#7c3aed">in</text><text x="285" y="140" fill="#f0f6fc"> plan:</text>
      <text x="135" y="160" fill="#8b949e"> 6</text><text x="160" y="160" fill="#f0f6fc">            self.</text><text x="225" y="160" fill="#79c0ff">run</text><text x="250" y="160" fill="#f0f6fc">(step)</text>
      <text x="135" y="180" fill="#8b949e"> 7</text><text x="160" y="180" fill="#f0f6fc">        </text><text x="175" y="180" fill="#7c3aed">return</text><text x="225" y="180" fill="#ffa657"> self.diff</text>
      <text x="135" y="200" fill="#8b949e"> 8</text>
      <text x="135" y="220" fill="#8b949e"> 9</text><text x="160" y="220" fill="#f0f6fc">agent = </text><text x="235" y="220" fill="#f0f6fc">CodeAgent(</text><text x="305" y="220" fill="#ffa657">"ollama"</text><text x="335" y="220" fill="#f0f6fc">)</text>
      <text x="135" y="240" fill="#8b949e">10</text><text x="160" y="240" fill="#3fb950">✓ 12 files generated</text>
      <text x="135" y="260" fill="#3fb950">✓ tests passing</text>
      <text x="135" y="280" fill="#58a6ff">▸ agent: explain this module</text>
    </g>
  </g>

  <!-- Facts panel -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="250" height="300" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="35" rx="8" fill="#238636"/>
    <text x="14" y="23" font-family="Segoe UI, Arial" font-size="13" fill="#f0f6fc" font-weight="bold">WHAT MAKES IT DIFFERENT</text>

    <text x="14" y="60" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">✓ Local Ollama models</text>
    <text x="14" y="78" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">  your code never leaves the machine</text>

    <text x="14" y="104" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">✓ Agentic build loop</text>
    <text x="14" y="122" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">  plan → generate → run → diff</text>

    <text x="14" y="148" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">✓ Explain + build modes</text>
    <text x="14" y="166" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">  understand any module instantly</text>

    <text x="14" y="192" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">✓ Open source</text>
    <text x="14" y="210" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">  full source on GitHub</text>

    <rect x="14" y="234" width="222" height="50" rx="6" fill="#1a1a24" stroke="#30363d"/>
    <text x="24" y="254" font-family="Segoe UI, Arial" font-size="10" fill="#d2a8ff">JavaScript · Ollama · Vercel</text>
    <text x="24" y="272" font-family="Segoe UI, Arial" font-size="10" fill="#58a6ff">mod-codes-ide.vercel.app</text>
  </g>

  <!-- Footer strip -->
  <rect x="30" y="400" width="740" height="70" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="428" font-family="Segoe UI, Arial" font-size="13" fill="#f0f6fc" font-weight="bold">FROM IDEA TO SHIPPED</text>
  <text x="50" y="450" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">The "Own AI IDE" vision from this lab is real — open-source, deployed, and building software with local models.</text>
  <text x="600" y="450" font-family="Segoe UI, Arial" font-size="11" fill="#7c3aed" font-weight="bold">MODCODES IDE</text>

  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>
