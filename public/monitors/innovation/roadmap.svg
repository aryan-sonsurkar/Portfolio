<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">RESEARCH AGENDA</text>
  <text x="230" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">AI & Development Tools Research</text>
  
  <!-- Research Areas -->
  <g transform="translate(30, 80)">
    <!-- Current Research -->
    <rect x="0" y="0" width="350" height="200" rx="8" fill="#21262d" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="350" height="35" rx="8" fill="#38bdf8"/>
    <text x="20" y="22" font-family="Segoe UI, Arial" font-size="14" fill="#0d1117" font-weight="bold">CURRENT RESEARCH</text>
    
    <text x="20" y="60" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Local LLM Optimization</text>
    <text x="20" y="80" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Ollama model performance tuning</text>
    <text x="20" y="95" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Context window management</text>
    <text x="20" y="110" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Response quality improvement</text>
    
    <text x="20" y="135" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">AI-Assisted Development</text>
    <text x="20" y="155" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Code generation models</text>
    <text x="20" y="170" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Error detection algorithms</text>
    <text x="20" y="185" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Refactoring suggestions</text>
    
    <!-- Future Research -->
    <rect x="380" y="0" width="390" height="200" rx="8" fill="#21262d" stroke="#7c3aed" stroke-width="2"/>
    <rect x="380" y="0" width="390" height="35" rx="8" fill="#7c3aed"/>
    <text x="400" y="22" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">FUTURE EXPLORATION</text>
    
    <text x="400" y="60" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Multi-Model Orchestration</text>
    <text x="400" y="80" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Hybrid AI mode</text>
    <text x="400" y="95" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Model selection based on task</text>
    <text x="400" y="110" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Ensemble approaches</text>
    
    <text x="400" y="135" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Autonomous Coding Agents</text>
    <text x="400" y="155" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Self-improving code generation</text>
    <text x="400" y="170" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Context-aware assistants</text>
    <text x="400" y="185" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Project-level understanding</text>
  </g>
  
  <!-- Research Goals -->
  <rect x="30" y="300" width="740" height="180" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="330" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">RESEARCH GOALS</text>
  
  <g transform="translate(50, 350)">
    <text x="0" y="0" font-family="Segoe UI, Arial" font-size="12" fill="#38bdf8" font-weight="bold">Short-term (6 months)</text>
    <text x="0" y="20" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Complete MODCODES AI integration</text>
    <text x="0" y="35" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Optimize local LLM performance</text>
    <text x="0" y="50" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Build working prototype of Fixly</text>
    
    <text x="0" y="80" font-family="Segoe UI, Arial" font-size="12" fill="#7c3aed" font-weight="bold">Long-term (1-2 years)</text>
    <text x="0" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Hybrid AI mode for MODCODES</text>
    <text x="0" y="115" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Multi-model orchestration</text>
    <text x="0" y="130" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Autonomous coding agents</text>
    
    <text x="350" y="0" font-family="Segoe UI, Arial" font-size="12" fill="#ffd700" font-weight="bold">Impact Vision</text>
    <text x="350" y="20" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Build AI tools that:</text>
    <text x="350" y="40" font-family="Segoe UI, Arial" font-size="10" fill="#3fb950">✓ Keep data private</text>
    <text x="350" y="55" font-family="Segoe UI, Arial" font-size="10" fill="#58a6ff">✓ Have no limits</text>
    <text x="350" y="70" font-family="Segoe UI, Arial" font-size="10" fill="#d2a8ff">✓ Are open-source</text>
    <text x="350" y="85" font-family="Segoe UI, Arial" font-size="10" fill="#f0883e">✓ Work offline</text>
    <text x="350" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#f778ba">✓ Are free forever</text>
    <text x="350" y="115" font-family="Segoe UI, Arial" font-size="10" fill="#38bdf8">✓ Augment human intelligence</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>