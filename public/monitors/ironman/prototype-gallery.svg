<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ff6600" stroke-width="0.3" stroke-opacity="0.15"/>
    </pattern>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#0a0808"/>
  <rect width="400" height="300" fill="url(#gridPattern)"/>

  <!-- Corner brackets -->
  <g stroke="#ff6600" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 10 30 L 10 10 L 30 10"/>
    <path d="M 370 10 L 390 10 L 390 30"/>
    <path d="M 390 270 L 390 290 L 370 290"/>
    <path d="M 30 290 L 10 290 L 10 270"/>
  </g>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#ff6600" letter-spacing="3" filter="url(#orangeGlow)">PROTOTYPE GALLERY</text>

  <!-- Frame 1: Arc Reactor -->
  <rect x="15" y="42" width="180" height="105" rx="2" fill="url(#frameGrad)" stroke="#ff6600" stroke-width="0.8" opacity="0.8"/>
  <text x="105" y="58" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ff6600" letter-spacing="1">01 // ARC REACTOR</text>
  <!-- Mini reactor -->
  <circle cx="70" cy="95" r="25" fill="none" stroke="#00aaff" stroke-width="1" opacity="0.5"/>
  <circle cx="70" cy="95" r="18" fill="none" stroke="#00aaff" stroke-width="0.8" opacity="0.6"/>
  <circle cx="70" cy="95" r="12" fill="none" stroke="#00ccff" stroke-width="1.2" opacity="0.7"/>
  <circle cx="70" cy="95" r="6" fill="#00aaff" opacity="0.4" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="95" r="2" fill="#ffffff" opacity="0.8"/>
  <!-- Status dots -->
  <circle cx="140" cy="80" r="2" fill="#00ff88" opacity="0.7"/>
  <circle cx="140" cy="90" r="2" fill="#00aaff" opacity="0.7"/>
  <circle cx="140" cy="100" r="2" fill="#ff6600" opacity="0.7"/>
  <text x="148" y="83" font-family="'Courier New', monospace" font-size="6" fill="#666666">MK I</text>
  <text x="148" y="93" font-family="'Courier New', monospace" font-size="6" fill="#666666">3 GW</text>
  <text x="148" y="103" font-family="'Courier New', monospace" font-size="6" fill="#666666">READY</text>
  <!-- Mini schematic lines -->
  <g stroke="#00aaff" stroke-width="0.3" opacity="0.3">
    <line x1="50" y1="125" x2="90" y2="125"/>
    <line x1="55" y1="130" x2="85" y2="130"/>
    <line x1="60" y1="135" x2="80" y2="135"/>
  </g>
  <text x="105" y="140" text-anchor="end" font-family="'Courier New', monospace" font-size="6" fill="#444444">REF: ARC-001</text>

  <!-- Frame 2: Glove -->
  <rect x="205" y="42" width="180" height="105" rx="2" fill="url(#frameGrad)" stroke="#ff6600" stroke-width="0.8" opacity="0.8"/>
  <text x="295" y="58" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ff6600" letter-spacing="1">02 // GLOVE PROTO</text>
  <!-- Mini glove -->
  <g transform="translate(255, 65)" fill="none" stroke="#ff4400" stroke-width="1" opacity="0.7">
    <path d="M 15 55 L 15 25 Q 15 20 20 18 L 25 15 Q 28 14 30 18 L 30 25 L 32 15 Q 33 12 36 12 L 37 16 L 38 13 Q 40 10 43 12 L 42 20 L 44 18 Q 46 16 48 20 L 45 30 L 46 35 Q 50 38 50 45 L 48 55"/>
    <path d="M 15 28 L 10 22 Q 8 18 10 15 L 15 18"/>
    <circle cx="32" cy="40" r="8" stroke="#ffd700" stroke-width="0.8"/>
    <circle cx="32" cy="40" r="3" fill="#ff4400" opacity="0.4"/>
    <circle cx="32" cy="40" r="1" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- Status dots -->
  <circle cx="330" cy="80" r="2" fill="#ff8800" opacity="0.7"/>
  <circle cx="330" cy="90" r="2" fill="#ffd700" opacity="0.7"/>
  <circle cx="330" cy="100" r="2" fill="#ff4400" opacity="0.7"/>
  <text x="338" y="83" font-family="'Courier New', monospace" font-size="6" fill="#666666">V1</text>
  <text x="338" y="93" font-family="'Courier New', monospace" font-size="6" fill="#666666">ARC</text>
  <text x="338" y="103" font-family="'Courier New', monospace" font-size="6" fill="#666666">PROTO</text>
  <!-- Mini schematic lines -->
  <g stroke="#ff4400" stroke-width="0.3" opacity="0.3">
    <line x1="240" y1="125" x2="280" y2="125"/>
    <line x1="245" y1="130" x2="275" y2="130"/>
    <line x1="250" y1="135" x2="270" y2="135"/>
  </g>
  <text x="295" y="140" text-anchor="end" font-family="'Courier New', monospace" font-size="6" fill="#444444">REF: GLV-001</text>

  <!-- Frame 3: LED Panel -->
  <rect x="15" y="155" width="180" height="105" rx="2" fill="url(#frameGrad)" stroke="#ff6600" stroke-width="0.8" opacity="0.8"/>
  <text x="105" y="171" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ff6600" letter-spacing="1">03 // LED PANEL</text>
  <!-- LED grid -->
  <g fill="none" stroke="#00aaff" stroke-width="0.5" opacity="0.4">
    <rect x="40" y="185" width="40" height="30" rx="1"/>
    <rect x="40" y="185" width="10" height="10" fill="#00aaff" opacity="0.2"/>
    <rect x="50" y="185" width="10" height="10" fill="#00ddff" opacity="0.3"/>
    <rect x="60" y="185" width="10" height="10" fill="#00aaff" opacity="0.15"/>
    <rect x="70" y="185" width="10" height="10" fill="#00ddff" opacity="0.25"/>
    <rect x="40" y="195" width="10" height="10" fill="#00ddff" opacity="0.2"/>
    <rect x="50" y="195" width="10" height="10" fill="#00aaff" opacity="0.3"/>
    <rect x="60" y="195" width="10" height="10" fill="#00ddff" opacity="0.15"/>
    <rect x="70" y="195" width="10" height="10" fill="#00aaff" opacity="0.2"/>
    <rect x="40" y="205" width="10" height="10" fill="#00aaff" opacity="0.25"/>
    <rect x="50" y="205" width="10" height="10" fill="#00ddff" opacity="0.2"/>
    <rect x="60" y="205" width="10" height="10" fill="#00aaff" opacity="0.3"/>
    <rect x="70" y="205" width="10" height="10" fill="#00ddff" opacity="0.15"/>
  </g>
  <!-- Status dots -->
  <circle cx="140" cy="195" r="2" fill="#00ff88" opacity="0.7"/>
  <circle cx="140" cy="205" r="2" fill="#00aaff" opacity="0.7"/>
  <circle cx="140" cy="215" r="2" fill="#ff6600" opacity="0.7"/>
  <text x="148" y="198" font-family="'Courier New', monospace" font-size="6" fill="#666666">64X32</text>
  <text x="148" y="208" font-family="'Courier New', monospace" font-size="6" fill="#666666">RGB</text>
  <text x="148" y="218" font-family="'Courier New', monospace" font-size="6" fill="#666666">ACTIVE</text>
  <!-- Mini schematic lines -->
  <g stroke="#00aaff" stroke-width="0.3" opacity="0.3">
    <line x1="40" y1="235" x2="80" y2="235"/>
    <line x1="45" y1="240" x2="75" y2="240"/>
    <line x1="50" y1="245" x2="70" y2="245"/>
  </g>
  <text x="105" y="250" text-anchor="end" font-family="'Courier New', monospace" font-size="6" fill="#444444">REF: LED-001</text>

  <!-- Frame 4: Sensor Array -->
  <rect x="205" y="155" width="180" height="105" rx="2" fill="url(#frameGrad)" stroke="#ff6600" stroke-width="0.8" opacity="0.8"/>
  <text x="295" y="171" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ff6600" letter-spacing="1">04 // SENSOR ARRAY</text>
  <!-- Sensor nodes -->
  <g fill="none" stroke="#ff6600" stroke-width="0.5" opacity="0.5">
    <circle cx="260" cy="200" r="6"/>
    <circle cx="280" cy="190" r="6"/>
    <circle cx="300" cy="195" r="6"/>
    <circle cx="320" cy="188" r="6"/>
    <circle cx="340" cy="195" r="6"/>
    <line x1="260" y1="200" x2="280" y2="190"/>
    <line x1="280" y1="190" x2="300" y2="195"/>
    <line x1="300" y1="195" x2="320" y2="188"/>
    <line x1="320" y1="188" x2="340" y2="195"/>
    <!-- Cross connections -->
    <line x1="260" y1="200" x2="300" y2="195" stroke-dasharray="2,2"/>
    <line x1="280" y1="190" x2="320" y2="188" stroke-dasharray="2,2"/>
  </g>
  <!-- Pulsing sensor nodes -->
  <circle cx="260" cy="200" r="2" fill="#ff6600" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="195" r="2" fill="#ff6600" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="195" r="2" fill="#ff6600" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- Status dots -->
  <circle cx="255" cy="220" r="2" fill="#00ff88" opacity="0.7"/>
  <circle cx="255" cy="230" r="2" fill="#ffd700" opacity="0.7"/>
  <circle cx="255" cy="240" r="2" fill="#ff4400" opacity="0.7"/>
  <text x="263" y="223" font-family="'Courier New', monospace" font-size="6" fill="#666666">5 NODES</text>
  <text x="263" y="233" font-family="'Courier New', monospace" font-size="6" fill="#666666">IR+ULTRA</text>
  <text x="263" y="243" font-family="'Courier New', monospace" font-size="6" fill="#666666">SYNC OK</text>
  <!-- Mini schematic lines -->
  <g stroke="#ff6600" stroke-width="0.3" opacity="0.3">
    <line x1="250" y1="248" x2="290" y2="248"/>
    <line x1="255" y1="253" x2="285" y2="253"/>
    <line x1="260" y1="258" x2="280" y2="258"/>
  </g>
  <text x="375" y="258" text-anchor="end" font-family="'Courier New', monospace" font-size="6" fill="#444444">REF: SNS-001</text>

  <!-- Bottom info bar -->
  <line x1="10" y1="270" x2="390" y2="270" stroke="#ff6600" stroke-width="0.5" opacity="0.3"/>
  <text x="20" y="283" font-family="'Courier New', monospace" font-size="7" fill="#333333">SYS://STARK.INDUSTRIES/PROTOTYPES</text>
  <text x="380" y="283" text-anchor="end" font-family="'Courier New', monospace" font-size="7" fill="#333333">4 UNITS</text>

  <circle cx="20" cy="293" r="2" fill="#ff6600" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="28" y="296" font-family="'Courier New', monospace" font-size="7" fill="#333333">CATALOG REF: PRG-001</text>
</svg>