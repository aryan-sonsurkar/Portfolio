<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6622"/>
      <stop offset="50%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#cc2200"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ff4400" stroke-width="0.3" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="#0a0808"/>
  <rect width="400" height="300" fill="url(#gridPattern)"/>

  <!-- Corner brackets -->
  <g stroke="#ff4400" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 10 30 L 10 10 L 30 10"/>
    <path d="M 370 10 L 390 10 L 390 30"/>
    <path d="M 390 270 L 390 290 L 370 290"/>
    <path d="M 30 290 L 10 290 L 10 270"/>
  </g>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#ff4400" letter-spacing="3">IRON MAN GLOVE v1</text>

  <!-- Glove outline - simplified hand shape -->
  <g transform="translate(60, 50)" fill="none" stroke="#ff4400" stroke-width="1.5" opacity="0.8">
    <!-- Palm -->
    <path d="M 60 200 L 60 100 Q 60 80 80 70 L 100 60 Q 110 55 115 60 L 118 80 L 120 55 Q 122 45 130 42 L 135 50 L 137 40 Q 140 30 148 32 L 150 45 L 155 35 Q 160 28 168 35 L 165 55 L 168 60 Q 175 65 175 80 L 172 200" stroke-width="2"/>
    <!-- Fingers -->
    <path d="M 100 60 L 95 25 Q 93 15 100 12 L 110 15 Q 115 18 115 25 L 115 55" stroke-width="1.5"/>
    <path d="M 120 50 L 118 10 Q 117 2 125 0 L 132 3 Q 138 6 137 15 L 135 45" stroke-width="1.5"/>
    <path d="M 140 42 L 142 8 Q 143 0 150 -2 L 157 2 Q 162 5 160 15 L 155 35" stroke-width="1.5"/>
    <path d="M 165 45 L 170 15 Q 172 8 178 10 L 182 18 Q 183 25 178 35 L 168 60" stroke-width="1.5"/>
    <!-- Thumb -->
    <path d="M 60 110 L 45 95 Q 38 88 35 80 L 30 65 Q 28 55 35 50 L 45 55 Q 50 58 50 65 L 55 90" stroke-width="1.5"/>
    <!-- Repulsor circle -->
    <circle cx="120" cy="155" r="22" stroke="#ff6600" stroke-width="2" filter="url(#glow)"/>
    <circle cx="120" cy="155" r="15" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <circle cx="120" cy="155" r="8" fill="#ff4400" opacity="0.3" filter="url(#redGlow)">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="155" r="3" fill="#ffffff" opacity="0.9" filter="url(#redGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Joint highlights -->
    <circle cx="95" cy="65" r="2" fill="#ffd700" opacity="0.5"/>
    <circle cx="120" cy="50" r="2" fill="#ffd700" opacity="0.5"/>
    <circle cx="145" cy="42" r="2" fill="#ffd700" opacity="0.5"/>
    <circle cx="168" cy="50" r="2" fill="#ffd700" opacity="0.5"/>
    <circle cx="50" cy="75" r="2" fill="#ffd700" opacity="0.5"/>
  </g>

  <!-- Gold accent lines on glove -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4">
    <line x1="120" y1="100" x2="120" y2="130" transform="translate(60,50)"/>
    <line x1="105" y1="115" x2="135" y2="115" transform="translate(60,50)"/>
    <line x1="100" y1="135" x2="140" y2="135" transform="translate(60,50)"/>
  </g>

  <!-- Spec box -->
  <rect x="255" y="80" width="135" height="140" rx="2" fill="#0a0808" stroke="#ff4400" stroke-width="0.8" opacity="0.9"/>
  <rect x="255" y="80" width="135" height="140" rx="2" fill="#220800" opacity="0.3"/>

  <!-- Spec header -->
  <text x="322" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#ff4400" letter-spacing="2">TECHNICAL SPECS</text>
  <line x1="265" y1="103" x2="380" y2="103" stroke="#ff4400" stroke-width="0.5" opacity="0.5"/>

  <!-- Spec values -->
  <text x="270" y="122" font-family="'Courier New', monospace" font-size="8" fill="#666666">REPULSOR</text>
  <text x="375" y="122" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#ff6600">FUNCTIONAL</text>

  <text x="270" y="142" font-family="'Courier New', monospace" font-size="8" fill="#666666">POWER</text>
  <text x="375" y="142" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#ffd700">ARC CELL</text>

  <text x="270" y="162" font-family="'Courier New', monospace" font-size="8" fill="#666666">MATERIAL</text>
  <text x="375" y="162" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#ff6600">GOLD-TITANIUM</text>

  <text x="270" y="182" font-family="'Courier New', monospace" font-size="8" fill="#666666">WEIGHT</text>
  <text x="375" y="182" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#ff6600">2.4 KG</text>

  <!-- Status indicator -->
  <line x1="265" y1="188" x2="380" y2="188" stroke="#ff4400" stroke-width="0.5" opacity="0.3"/>
  <text x="270" y="202" font-family="'Courier New', monospace" font-size="8" fill="#666666">STATUS</text>
  <circle cx="310" cy="199" r="3" fill="#ff8800" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="318" y="202" font-family="'Courier New', monospace" font-size="10" fill="#ff8800">PROTOTYPE</text>

  <!-- Warning stripes -->
  <g opacity="0.15">
    <line x1="60" y1="245" x2="180" y2="245" stroke="#ffd700" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="220" y1="245" x2="340" y2="245" stroke="#ff4400" stroke-width="3" stroke-dasharray="8,4"/>
  </g>

  <!-- Bottom status bar -->
  <line x1="10" y1="250" x2="390" y2="250" stroke="#ff4400" stroke-width="0.5" opacity="0.3"/>
  <text x="20" y="265" font-family="'Courier New', monospace" font-size="7" fill="#333333">SYS://STARK.INDUSTRIES/GLOVE/V1</text>
  <text x="380" y="265" text-anchor="end" font-family="'Courier New', monospace" font-size="7" fill="#333333">BUILD 047</text>

  <circle cx="20" cy="280" r="2" fill="#ff4400" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="28" y="283" font-family="'Courier New', monospace" font-size="7" fill="#333333">BLUEPRINT REF: GLV-001</text>
</svg>