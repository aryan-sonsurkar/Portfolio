    <text x="270" y="85" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Code Completion</text>
    <text x="270" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Error Detection</text>
    <text x="270" y="115" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Refactoring Suggestions</text>
    
    <text x="270" y="145" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">○ Developer Tools</text>
    <text x="270" y="165" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Debug Console</text>
    <text x="270" y="180" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Performance Profiler</text>
    <text x="270" y="195" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Database Viewer</text>
    
    <text x="270" y="225" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">○ Extensions</text>
    <text x="270" y="245" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Plugin Architecture</text>
    <text x="270" y="260" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Theme System</text>
    <text x="270" y="275" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Custom Keybindings</text>
    
    <text x="270" y="305" font-family="Segoe UI, Arial" font-size="11" fill="#d2a8ff" font-weight="bold">Beta Release</text>
    <text x="270" y="325" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Target: Nov 2026</text>
    
    <!-- Q1 2027 -->
    <rect x="500" y="0" width="250" height="400" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-width="2"/>
    <rect x="500" y="0" width="250" height="40" rx="8" fill="#8957e5"/>
    <text x="520" y="25" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">Q1 2027</text>
    
    <text x="520" y="65" font-family="Segoe UI, Arial" font-size="12" fill="#d2a8ff">○ Advanced AI</text>
    <text x="520" y="85" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Multi-Model Support</text>
    <text x="520" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Context-Aware Assistance</text>
    <text x="520" y="115" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Code Generation</text>
    
    <text x="520" y="145" font-family="Segoe UI, Arial" font-size="12" fill="#d2a8ff">○ Collaboration</text>
    <text x="520" y="165" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Real-time Editing</text>
    <text x="520" y="180" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Code Review Tools</text>
    <text x="520" y="195" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Team Workspaces</text>
    
    <text x="520" y="225" font-family="Segoe UI, Arial" font-size="12" fill="#d2a8ff">○ Ecosystem</text>
    <text x="520" y="245" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Marketplace</text>
    <text x="520" y="260" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Community Plugins</text>
    <text x="520" y="275" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Documentation Hub</text>
    
    <text x="520" y="305" font-family="Segoe UI, Arial" font-size="11" fill="#d2a8ff" font-weight="bold">v1.0 Release</text>
    <text x="520" y="325" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Target: Feb 2027</text>
