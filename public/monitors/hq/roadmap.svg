<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">MODCODES ROADMAP</text>
  <text x="250" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">2026 - 2027</text>
  
  <!-- Timeline -->
  <g transform="translate(30, 80)">
    <!-- Q3 2026 -->
    <rect x="0" y="0" width="230" height="400" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="40" rx="8" fill="#238636"/>
    <text x="20" y="25" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">Q3 2026</text>
    <text x="120" y="25" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">Current</text>
    
    <text x="20" y="65" font-family="Segoe UI, Arial" font-size="12" fill="#3fb950">✓ Foundation</text>
    <text x="20" y="85" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Project Manager UI</text>
    <text x="20" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Workspace Layout</text>
    <text x="20" y="115" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Local Storage</text>
    
    <text x="20" y="145" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">● In Progress</text>
    <text x="20" y="165" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• AI Chat Panel</text>
    <text x="20" y="180" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Code Editor (Monaco)</text>
    <text x="20" y="195" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• File Explorer</text>
    
    <text x="20" y="225" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">○ Upcoming</text>
    <text x="20" y="245" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Ollama Integration</text>
