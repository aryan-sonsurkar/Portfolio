    <text x="20" y="275" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Git Integration</text>
    
    <text x="20" y="305" font-family="Segoe UI, Arial" font-size="11" fill="#d2a8ff" font-weight="bold">MVP Release</text>
    <text x="20" y="325" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Target: Aug 2026</text>
    
    <!-- Q4 2026 -->
