    <rect x="0" y="120" width="20" height="80" fill="#26a641"/>
    <rect x="0" y="80" width="20" height="120" fill="#39d353"/>
    
    <rect x="30" y="160" width="20" height="40" fill="#0e4429"/>
    <rect x="30" y="140" width="20" height="60" fill="#006d32"/>
    <rect x="30" y="100" width="20" height="100" fill="#26a641"/>
    <rect x="30" y="60" width="20" height="140" fill="#39d353"/>
    
    <rect x="60" y="140" width="20" height="60" fill="#0e4429"/>
    <rect x="60" y="100" width="20" height="100" fill="#006d32"/>
    <rect x="60" y="60" width="20" height="140" fill="#26a641"/>
    <rect x="60" y="20" width="20" height="180" fill="#39d353"/>
    
