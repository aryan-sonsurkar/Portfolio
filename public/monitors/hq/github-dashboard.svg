  <text x="570" y="230" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">Recent Projects</text>
  
  <text x="570" y="265" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">aryan-os-portfolio</text>
  <text x="570" y="285" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Next.js • TypeScript • R3F</text>
  
