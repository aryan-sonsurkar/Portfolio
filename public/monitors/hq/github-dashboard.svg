  <text x="570" y="365" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">fixly-desktop</text>
  <text x="570" y="385" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TypeScript • AI Integration</text>
  
  <text x="570" y="415" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">draco-cli</text>
  <text x="570" y="435" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Python • AI Assistant</text>
  
  <text x="570" y="465" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">kokanam-in</text>
  <text x="570" y="485" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">React • Next.js • E-commerce</text>
  
