  <text x="50" y="145" font-family="Segoe UI, Arial" font-size="32" fill="#f0f6fc" font-weight="bold">12</text>
  
  <rect x="220" y="80" width="170" height="100" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="240" y="110" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Commits Today</text>
  <text x="240" y="145" font-family="Segoe UI, Arial" font-size="32" fill="#3fb950" font-weight="bold">47</text>
  
  <rect x="410" y="80" width="170" height="100" rx="8" fill="#21262d" stroke="#30363d"/>
