<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">DATABASE SCHEMA</text>
  <text x="220" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">Local Storage Architecture</text>
  
  <!-- Schema Diagram -->
  <g transform="translate(30, 80)">
    <!-- Projects Table -->
    <rect x="0" y="0" width="200" height="250" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="35" rx="8" fill="#238636"/>
    <text x="20" y="22" font-family="Segoe UI, Arial" font-size="13" fill="#f0f6fc" font-weight="bold">projects</text>
    
    <text x="20" y="60" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">id</text>
    <text x="120" y="60" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">UUID</text>
    
    <text x="20" y="80" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">name</text>
    <text x="120" y="80" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">VARCHAR(255)</text>
    
    <text x="20" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">description</text>
    <text x="120" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TEXT</text>
    
    <text x="20" y="120" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">created_at</text>
    <text x="120" y="120" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TIMESTAMP</text>
    
    <text x="20" y="140" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">updated_at</text>
    <text x="120" y="140" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TIMESTAMP</text>
    
    <text x="20" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">status</text>
    <text x="120" y="160" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">ENUM</text>
    
    <text x="20" y="180" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">settings</text>
    <text x="120" y="180" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">JSON</text>
    
    <text x="20" y="200" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">ai_config</text>
    <text x="120" y="200" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">JSON</text>
    
    <!-- Relationships -->
    <text x="20" y="230" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">→ files (1:N)</text>
    <text x="20" y="245" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">→ tasks (1:N)</text>
    
    <!-- Files Table -->
    <rect x="250" y="0" width="200" height="220" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <rect x="250" y="0" width="200" height="35" rx="8" fill="#1f6feb"/>
    <text x="270" y="22" font-family="Segoe UI, Arial" font-size="13" fill="#f0f6fc" font-weight="bold">files</text>
    
    <text x="270" y="60" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">id</text>
    <text x="370" y="60" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">UUID</text>
    
    <text x="270" y="80" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">project_id</text>
    <text x="370" y="80" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">UUID (FK)</text>
    
    <text x="270" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">path</text>
    <text x="370" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">VARCHAR(500)</text>
    
    <text x="270" y="120" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">content</text>
    <text x="370" y="120" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TEXT</text>
    
    <text x="270" y="140" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">language</text>
    <text x="370" y="140" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">VARCHAR(50)</text>
    
    <text x="270" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">size</text>
    <text x="370" y="160" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">INTEGER</text>
    
    <text x="270" y="180" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">modified_at</text>
    <text x="370" y="180" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TIMESTAMP</text>
    
    <text x="270" y="200" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">← projects (N:1)</text>
    
    <!-- Tasks Table -->
    <rect x="500" y="0" width="250" height="280" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-width="2"/>
    <rect x="500" y="0" width="250" height="35" rx="8" fill="#8957e5"/>
    <text x="520" y="22" font-family="Segoe UI, Arial" font-size="13" fill="#f0f6fc" font-weight="bold">tasks</text>
    
    <text x="520" y="60" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">id</text>
    <text x="650" y="60" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">UUID</text>
    
    <text x="520" y="80" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">project_id</text>
    <text x="650" y="80" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">UUID (FK)</text>
    
    <text x="520" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">title</text>
    <text x="650" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">VARCHAR(255)</text>
    
    <text x="520" y="120" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">description</text>
    <text x="650" y="120" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TEXT</text>
    
    <text x="520" y="140" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">status</text>
    <text x="650" y="140" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">ENUM</text>
    
    <text x="520" y="160" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">priority</text>
    <text x="650" y="160" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">ENUM</text>
    
    <text x="520" y="180" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">assignee</text>
    <text x="650" y="180" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">VARCHAR(100)</text>
    
    <text x="520" y="200" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">due_date</text>
    <text x="650" y="200" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TIMESTAMP</text>
    
    <text x="520" y="220" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">tags</text>
    <text x="650" y="220" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">JSON</text>
    
    <text x="520" y="240" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">ai_notes</text>
    <text x="650" y="240" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">TEXT</text>
    
    <text x="520" y="260" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">← projects (N:1)</text>
    
    <!-- Key Features -->
    <rect x="0" y="300" width="750" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="325" font-family="Segoe UI, Arial" font-size="12" fill="#3fb950">✓ Zero Cloud Dependency</text>
    <text x="200" y="325" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">✓ IndexedDB Storage</text>
    <text x="400" y="325" font-family="Segoe UI, Arial" font-size="12" fill="#d2a8ff">✓ JSON Fields for Flexibility</text>
    <text x="20" y="355" font-family="Segoe UI, Arial" font-size="12" fill="#f0883e">✓ UUID Primary Keys</text>
    <text x="200" y="355" font-family="Segoe UI, Arial" font-size="12" fill="#f778ba">✓ Timestamp Tracking</text>
    <text x="400" y="355" font-family="Segoe UI, Arial" font-size="12" fill="#3fb950">✓ Offline First</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>