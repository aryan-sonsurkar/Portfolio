<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">SYSTEM ARCHITECTURE</text>
  <text x="300" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">MODCODES IDE</text>
  
  <!-- Architecture Diagram -->
  <g transform="translate(50, 100)">
    <!-- Frontend Layer -->
    <rect x="0" y="0" width="700" height="80" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="20" y="30" font-family="Segoe UI, Arial" font-size="14" fill="#58a6ff" font-weight="bold">FRONTEND</text>
    <text x="20" y="50" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Next.js App Router • React • TypeScript</text>
    <text x="20" y="65" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Monaco Editor • Socket.io Client</text>
    
    <!-- Arrow -->
    <path d="M350 80 L350 110" stroke="#30363d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- API Layer -->
    <rect x="100" y="110" width="500" height="70" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="120" y="140" font-family="Segoe UI, Arial" font-size="14" fill="#3fb950" font-weight="bold">API LAYER</text>
    <text x="120" y="155" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Next.js API Routes • WebSocket Server</text>
    <text x="120" y="170" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Authentication • Rate Limiting</text>
    
    <!-- Arrow -->
    <path d="M350 180 L350 210" stroke="#30363d" stroke-width="2" fill="none"/>
    
    <!-- AI Layer -->
    <rect x="50" y="210" width="300" height="80" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-width="2"/>
    <text x="70" y="240" font-family="Segoe UI, Arial" font-size="14" fill="#d2a8ff" font-weight="bold">AI ENGINE</text>
    <text x="70" y="255" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Ollama Local Models</text>
    <text x="70" y="270" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">OpenRouter API • Nemotron 3 Ultra</text>
    <text x="70" y="285" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Code Generation • Debugging</text>
    
    <!-- Storage Layer -->
    <rect x="400" y="210" width="300" height="80" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="420" y="240" font-family="Segoe UI, Arial" font-size="14" fill="#f0883e" font-weight="bold">LOCAL STORAGE</text>
    <text x="420" y="255" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">IndexedDB • LocalStorage</text>
    <text x="420" y="270" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">File System Access API</text>
    <text x="420" y="285" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Zero Cloud Dependency</text>
    
    <!-- Arrows -->
    <path d="M200 290 L200 320" stroke="#30363d" stroke-width="2" fill="none"/>
    <path d="M550 290 L550 320" stroke="#30363d" stroke-width="2" fill="none"/>
    
    <!-- Database Layer -->
    <rect x="150" y="320" width="400" height="70" rx="8" fill="#21262d" stroke="#f778ba" stroke-width="2"/>
    <text x="170" y="350" font-family="Segoe UI, Arial" font-size="14" fill="#f778ba" font-weight="bold">DATA PERSISTENCE</text>
    <text x="170" y="365" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">Project Files • Configuration • AI Models Cache</text>
    <text x="170" y="380" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">All data stays on user's machine</text>
    
    <!-- Key Features -->
    <rect x="0" y="410" width="700" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="435" font-family="Segoe UI, Arial" font-size="12" fill="#3fb950">✓ Privacy First</text>
    <text x="150" y="435" font-family="Segoe UI, Arial" font-size="12" fill="#58a6ff">✓ No Limits</text>
    <text x="260" y="435" font-family="Segoe UI, Arial" font-size="12" fill="#d2a8ff">✓ Local AI</text>
    <text x="360" y="435" font-family="Segoe UI, Arial" font-size="12" fill="#f0883e">✓ Open Source</text>
    <text x="480" y="435" font-family="Segoe UI, Arial" font-size="12" fill="#f778ba">✓ No DB</text>
    <text x="570" y="435" font-family="Segoe UI, Arial" font-size="12" fill="#3fb950">✓ Free Forever</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>