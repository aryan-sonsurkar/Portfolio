<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="sans-serif" font-size="22" fill="#f0f6fc" font-weight="bold">VS CODE EDITOR</text>
  <text x="220" y="38" font-family="sans-serif" font-size="14" fill="#8b949e">Aryan's Development Environment</text>
  
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="740" height="400" rx="8" fill="#21262d" stroke="#30363d"/>
    
    <rect x="0" y="0" width="740" height="30" rx="8" fill="#323233"/>
    <text x="20" y="20" font-family="sans-serif" font-size="12" fill="#f0f6fc">modcodes-ide - Visual Studio Code</text>
    
    <rect x="0" y="30" width="740" height="25" fill="#3c3c3c"/>
    <text x="20" y="47" font-family="sans-serif" font-size="10" fill="#cccccc">File  Edit  Selection  View  Go  Run  Terminal  Help</text>
    
    <rect x="0" y="55" width="50" height="345" fill="#252526"/>
    <rect x="12" y="70" width="12" height="10" fill="#858585" rx="1"/>
    <rect x="12" y="100" width="12" height="10" fill="#858585" rx="1"/>
    <rect x="12" y="130" width="12" height="10" fill="#858585" rx="1"/>
    <rect x="12" y="160" width="12" height="10" fill="#858585" rx="1"/>
    <rect x="12" y="190" width="12" height="10" fill="#858585" rx="1"/>
    
    <rect x="50" y="55" width="180" height="345" fill="#252526"/>
    <text x="65" y="75" font-family="sans-serif" font-size="11" fill="#f0f6fc" font-weight="bold">EXPLORER</text>
    <text x="65" y="100" font-family="sans-serif" font-size="10" fill="#cccccc">src/</text>
    <text x="80" y="120" font-family="sans-serif" font-size="10" fill="#cccccc">app/</text>
    <text x="80" y="140" font-family="sans-serif" font-size="10" fill="#cccccc">components/</text>
    <text x="80" y="160" font-family="sans-serif" font-size="10" fill="#cccccc">lib/</text>
    <text x="80" y="180" font-family="sans-serif" font-size="10" fill="#cccccc">config/</text>
    <text x="65" y="210" font-family="sans-serif" font-size="10" fill="#cccccc">package.json</text>
    <text x="65" y="230" font-family="sans-serif" font-size="10" fill="#cccccc">tsconfig.json</text>
    <text x="65" y="250" font-family="sans-serif" font-size="10" fill="#cccccc">next.config.js</text>
    
    <rect x="230" y="55" width="510" height="345" fill="#1e1e1e"/>
    
    <rect x="230" y="55" width="120" height="25" fill="#2d2d2d"/>
    <text x="245" y="72" font-family="sans-serif" font-size="10" fill="#f0f6fc">page.tsx</text>
    
    <rect x="350" y="55" width="120" height="25" fill="#1e1e1e"/>
    <text x="365" y="72" font-family="sans-serif" font-size="10" fill="#858585">layout.tsx</text>
    
    <text x="245" y="100" font-family="monospace" font-size="10" fill="#569cd6">import</text>
    <text x="290" y="100" font-family="monospace" font-size="10" fill="#ce9178">{"{ Experience }"}</text>
    <text x="370" y="100" font-family="monospace" font-size="10" fill="#569cd6">from</text>
    <text x="400" y="100" font-family="monospace" font-size="10" fill="#ce9178">'@/components/Experience'</text>
    
    <text x="245" y="120" font-family="monospace" font-size="10" fill="#569cd6">export default function</text>
    <text x="400" y="120" font-family="monospace" font-size="10" fill="#dcdcaa">Home</text>
    <text x="430" y="120" font-family="monospace" font-size="10" fill="#f0f6fc">() {"{"}</text>
    
    <text x="245" y="140" font-family="monospace" font-size="10" fill="#f0f6fc">  return (</text>
    <text x="245" y="160" font-family="monospace" font-size="10" fill="#569cd6">&lt;main&gt;</text>
    <text x="245" y="180" font-family="monospace" font-size="10" fill="#569cd6">  &lt;Experience /&gt;</text>
    <text x="245" y="200" font-family="monospace" font-size="10" fill="#569cd6">&lt;/main&gt;</text>
    <text x="245" y="220" font-family="monospace" font-size="10" fill="#f0f6fc">  )</text>
    <text x="245" y="240" font-family="monospace" font-size="10" fill="#f0f6fc">{"}"}</text>
    
    <text x="235" y="100" font-family="monospace" font-size="10" fill="#858585">1</text>
    <text x="235" y="120" font-family="monospace" font-size="10" fill="#858585">2</text>
    <text x="235" y="140" font-family="monospace" font-size="10" fill="#858585">3</text>
    <text x="235" y="160" font-family="monospace" font-size="10" fill="#858585">4</text>
    <text x="235" y="180" font-family="monospace" font-size="10" fill="#858585">5</text>
    <text x="235" y="200" font-family="monospace" font-size="10" fill="#858585">6</text>
    <text x="235" y="220" font-family="monospace" font-size="10" fill="#858585">7</text>
    <text x="235" y="240" font-family="monospace" font-size="10" fill="#858585">8</text>
    
    <rect x="0" y="400" width="740" height="20" fill="#007acc"/>
    <text x="20" y="414" font-family="sans-serif" font-size="10" fill="#f0f6fc">main</text>
    <text x="100" y="414" font-family="sans-serif" font-size="10" fill="#f0f6fc">TypeScript React</text>
    <text x="250" y="414" font-family="sans-serif" font-size="10" fill="#f0f6fc">UTF-8</text>
    <text x="350" y="414" font-family="sans-serif" font-size="10" fill="#f0f6fc">LF</text>
    <text x="600" y="414" font-family="sans-serif" font-size="10" fill="#f0f6fc">Prettier</text>
    <text x="680" y="414" font-family="sans-serif" font-size="10" fill="#f0f6fc">ESLint</text>
  </g>
  
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
