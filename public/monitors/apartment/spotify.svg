<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <rect x="0" y="0" width="800" height="60" fill="#181818" stroke="#282828" stroke-width="1"/>
  <text x="30" y="38" font-family="sans-serif" font-size="22" fill="#1db954" font-weight="bold">NOW PLAYING</text>
  <text x="200" y="38" font-family="sans-serif" font-size="14" fill="#b3b3b3">Spotify - Coding Playlist</text>
  
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="350" height="400" rx="8" fill="#282828"/>
    
    <rect x="20" y="20" width="310" height="200" rx="4" fill="#404040"/>
    <text x="175" y="120" font-family="sans-serif" font-size="30" fill="#1db954" text-anchor="middle">&#9835;</text>
    <text x="175" y="155" font-family="sans-serif" font-size="12" fill="#b3b3b3" text-anchor="middle">Album Art</text>
    
    <text x="20" y="250" font-family="sans-serif" font-size="16" fill="#f0f6fc" font-weight="bold">Coding Session Mix</text>
    <text x="20" y="275" font-family="sans-serif" font-size="12" fill="#b3b3b3">Aryan's Coding Playlist</text>
    
    <rect x="20" y="300" width="310" height="4" rx="2" fill="#404040"/>
    <rect x="20" y="300" width="150" height="4" rx="2" fill="#1db954"/>
    <text x="20" y="320" font-family="sans-serif" font-size="10" fill="#b3b3b3">2:34</text>
    <text x="300" y="320" font-family="sans-serif" font-size="10" fill="#b3b3b3">5:08</text>
    
    <text x="130" y="365" font-family="sans-serif" font-size="22" fill="#b3b3b3">&#9198; &#9208; &#9197;</text>
    <text x="155" y="390" font-family="sans-serif" font-size="10" fill="#1db954">Volume: 75%</text>
  </g>
  
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="370" height="400" rx="8" fill="#282828"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#f0f6fc" font-weight="bold">PLAYLIST</text>
    
    <text x="20" y="60" font-family="sans-serif" font-size="11" fill="#1db954">1. Focus Flow</text>
    <text x="20" y="80" font-family="sans-serif" font-size="10" fill="#b3b3b3">Lo-fi Beats - 3:45</text>
    
    <text x="20" y="105" font-family="sans-serif" font-size="11" fill="#f0f6fc">2. Deep Work</text>
    <text x="20" y="125" font-family="sans-serif" font-size="10" fill="#b3b3b3">Ambient - 4:12</text>
    
    <text x="20" y="150" font-family="sans-serif" font-size="11" fill="#f0f6fc">3. Code &amp; Chill</text>
    <text x="20" y="170" font-family="sans-serif" font-size="10" fill="#b3b3b3">Instrumental - 3:58</text>
    
    <text x="20" y="195" font-family="sans-serif" font-size="11" fill="#f0f6fc">4. Midnight Coding</text>
    <text x="20" y="215" font-family="sans-serif" font-size="10" fill="#b3b3b3">Electronic - 4:30</text>
    
    <text x="20" y="240" font-family="sans-serif" font-size="11" fill="#f0f6fc">5. Debug Mode</text>
    <text x="20" y="260" font-family="sans-serif" font-size="10" fill="#b3b3b3">Chillhop - 3:22</text>
    
    <text x="20" y="285" font-family="sans-serif" font-size="11" fill="#f0f6fc">6. Algorithm Dreams</text>
    <text x="20" y="305" font-family="sans-serif" font-size="10" fill="#b3b3b3">Classical - 5:15</text>
    
    <text x="20" y="330" font-family="sans-serif" font-size="11" fill="#f0f6fc">7. Stack Overflow</text>
    <text x="20" y="350" font-family="sans-serif" font-size="10" fill="#b3b3b3">Jazz - 4:02</text>
    
    <text x="20" y="375" font-family="sans-serif" font-size="11" fill="#f0f6fc">8. Compilation Complete</text>
    <text x="20" y="395" font-family="sans-serif" font-size="10" fill="#b3b3b3">Upbeat - 3:48</text>
