<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">CONTRIBUTION GRAPH</text>
  <text x="250" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">@aryan-sonsurkar</text>
  
  <!-- Contribution Stats -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="20" y="25" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Total Contributions</text>
    <text x="20" y="65" font-family="Segoe UI, Arial" font-size="36" fill="#3fb950" font-weight="bold">333</text>
    <text x="20" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">in 2026</text>
    
    <rect x="200" y="0" width="180" height="100" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="220" y="25" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Current Streak</text>
    <text x="220" y="65" font-family="Segoe UI, Arial" font-size="36" fill="#58a6ff" font-weight="bold">14</text>
    <text x="220" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">days</text>
    
    <rect x="400" y="0" width="180" height="100" rx="8" fill="#21262d" stroke="#ffd700" stroke-width="2"/>
    <text x="420" y="25" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Longest Streak</text>
    <text x="420" y="65" font-family="Segoe UI, Arial" font-size="36" fill="#ffd700" font-weight="bold">31</text>
    <text x="420" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">days</text>
    
    <rect x="600" y="0" width="170" height="100" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-width="2"/>
    <text x="620" y="25" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Total Commits</text>
    <text x="620" y="65" font-family="Segoe UI, Arial" font-size="36" fill="#d2a8ff" font-weight="bold">500+</text>
    <text x="620" y="85" font-family="Segoe UI, Arial" font-size="11" fill="#8b949e">across repos</text>
  </g>
  
  <!-- Graph -->
  <rect x="30" y="200" width="740" height="280" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="230" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">Contribution Activity</text>
  
  <!-- Month Labels -->
  <g transform="translate(50, 250)">
    <text x="0" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Jan</text>
    <text x="60" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Feb</text>
    <text x="120" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Mar</text>
    <text x="180" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Apr</text>
    <text x="240" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">May</text>
    <text x="300" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Jun</text>
    <text x="360" y="0" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Jul</text>
    
    <!-- Activity bars -->
    <rect x="0" y="20" width="40" height="180" fill="#0e4429"/>
    <rect x="0" y="60" width="40" height="140" fill="#006d32"/>
    <rect x="0" y="100" width="40" height="100" fill="#26a641"/>
    <rect x="0" y="140" width="40" height="60" fill="#39d353"/>
    
    <rect x="60" y="40" width="40" height="160" fill="#0e4429"/>
    <rect x="60" y="80" width="40" height="120" fill="#006d32"/>
    <rect x="60" y="120" width="40" height="80" fill="#26a641"/>
    <rect x="60" y="160" width="40" height="40" fill="#39d353"/>
    
    <rect x="120" y="60" width="40" height="140" fill="#0e4429"/>
    <rect x="120" y="100" width="40" height="100" fill="#006d32"/>
    <rect x="120" y="140" width="40" height="60" fill="#26a641"/>
    <rect x="120" y="180" width="40" height="20" fill="#39d353"/>
    
    <rect x="180" y="80" width="40" height="120" fill="#0e4429"/>
    <rect x="180" y="120" width="40" height="80" fill="#006d32"/>
    <rect x="180" y="160" width="40" height="40" fill="#26a641"/>
    
    <rect x="240" y="100" width="40" height="100" fill="#0e4429"/>
    <rect x="240" y="140" width="40" height="60" fill="#006d32"/>
    <rect x="240" y="180" width="40" height="20" fill="#26a641"/>
    
    <rect x="300" y="120" width="40" height="80" fill="#0e4429"/>
    <rect x="300" y="160" width="40" height="40" fill="#006d32"/>
    
    <rect x="360" y="140" width="40" height="60" fill="#0e4429"/>
    <rect x="360" y="180" width="40" height="20" fill="#006d32"/>
    
    <!-- Legend -->
    <rect x="500" y="20" width="15" height="15" fill="#0e4429"/>
    <text x="520" y="32" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Less</text>
    
    <rect x="560" y="20" width="15" height="15" fill="#006d32"/>
    <rect x="600" y="20" width="15" height="15" fill="#26a641"/>
    <rect x="640" y="20" width="15" height="15" fill="#39d353"/>
    <text x="660" y="32" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">More</text>
    
    <!-- Stats -->
    <text x="500" y="60" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">PRs Opened: 12</text>
    <text x="500" y="80" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Issues Created: 8</text>
    <text x="500" y="100" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Reviews Given: 25+</text>
    <text x="500" y="120" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Languages: 4</text>
    <text x="500" y="140" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Active Days: 280+</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>