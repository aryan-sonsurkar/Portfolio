<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#001122"/>
      <stop offset="50%" style="stop-color:#00aaff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#001122"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#050a14"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#050a14"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#00aaff">
    <line x1="200" y1="0" x2="200" y2="300" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke-width="0.5"/>
  </g>

  <!-- Header -->
  <rect x="0" y="0" width="400" height="40" fill="url(#headerGrad)"/>
  <text x="200" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#00aaff" filter="url(#glow)">VISION 2026</text>

  <!-- Decorative line under header -->
  <line x1="100" y1="36" x2="300" y2="36" stroke="#00aaff" stroke-width="1" opacity="0.5"/>

  <!-- Quadrant 1: BUILD -->
  <rect x="15" y="50" width="178" height="118" rx="4" fill="url(#cardGrad)" stroke="#003355" stroke-width="0.5"/>
  <text x="104" y="74" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00aaff">BUILD</text>
  <circle cx="35" cy="70" r="3" fill="#00aaff" opacity="0.8"/>
  <line x1="30" y1="82" x2="178" y2="82" stroke="#003355" stroke-width="0.5"/>
  <text x="104" y="106" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ccff">MODCODES v2.0</text>
  <rect x="30" y="120" width="148" height="4" rx="2" fill="#0a1628"/>
  <rect x="30" y="120" width="100" height="4" rx="2" fill="#00aaff" opacity="0.7"/>
  <text x="104" y="140" text-anchor="middle" font-family="monospace" font-size="8" fill="#446688">IN PROGRESS</text>

  <!-- Quadrant 2: LEARN -->
  <rect x="207" y="50" width="178" height="118" rx="4" fill="url(#cardGrad)" stroke="#003355" stroke-width="0.5"/>
  <text x="296" y="74" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00aaff">LEARN</text>
  <circle cx="217" cy="70" r="3" fill="#00aaff" opacity="0.8"/>
  <line x1="222" y1="82" x2="370" y2="82" stroke="#003355" stroke-width="0.5"/>
  <text x="296" y="106" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ccff">Compiler Design</text>
  <rect x="222" y="120" width="148" height="4" rx="2" fill="#0a1628"/>
  <rect x="222" y="120" width="65" height="4" rx="2" fill="#00aaff" opacity="0.7"/>
  <text x="296" y="140" text-anchor="middle" font-family="monospace" font-size="8" fill="#446688">STUDYING</text>

  <!-- Quadrant 3: SHIP -->
  <rect x="15" y="174" width="178" height="118" rx="4" fill="url(#cardGrad)" stroke="#003355" stroke-width="0.5"/>
  <text x="104" y="198" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00aaff">SHIP</text>
  <circle cx="35" cy="194" r="3" fill="#00aaff" opacity="0.8"/>
  <line x1="30" y1="206" x2="178" y2="206" stroke="#003355" stroke-width="0.5"/>
  <text x="104" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ccff">Open Source Tools</text>
  <rect x="30" y="244" width="148" height="4" rx="2" fill="#0a1628"/>
  <rect x="30" y="244" width="45" height="4" rx="2" fill="#00aaff" opacity="0.7"/>
  <text x="104" y="264" text-anchor="middle" font-family="monospace" font-size="8" fill="#446688">PLANNING</text>

  <!-- Quadrant 4: GROW -->
  <rect x="207" y="174" width="178" height="118" rx="4" fill="url(#cardGrad)" stroke="#003355" stroke-width="0.5"/>
  <text x="296" y="198" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00aaff">GROW</text>
  <circle cx="217" cy="194" r="3" fill="#00aaff" opacity="0.8"/>
  <line x1="222" y1="206" x2="370" y2="206" stroke="#003355" stroke-width="0.5"/>
  <text x="296" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ccff">Full-Stack Mastery</text>
  <rect x="222" y="244" width="148" height="4" rx="2" fill="#0a1628"/>
  <rect x="222" y="244" width="95" height="4" rx="2" fill="#00aaff" opacity="0.7"/>
  <text x="296" y="264" text-anchor="middle" font-family="monospace" font-size="8" fill="#446688">ONGOING</text>
</svg>
