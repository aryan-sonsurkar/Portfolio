<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">VISHWANATH INSURANCE</text>
  <text x="320" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">Client Portfolio</text>
  
  <!-- Project Info -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="740" height="150" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="20" y="30" font-family="Segoe UI, Arial" font-size="14" fill="#3fb950" font-weight="bold">PROJECT DETAILS</text>
    
    <text x="20" y="60" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Client: Vishwanath Malusare</text>
    <text x="20" y="80" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Type: Professional Portfolio Website</text>
    <text x="20" y="100" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Duration: 2 weeks</text>
    <text x="20" y="120" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Role: Frontend Developer</text>
    <text x="20" y="140" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Company: Kaevron Technologies</text>
    
    <text x="400" y="60" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Tech Stack:</text>
    <text x="400" y="80" font-family="Segoe UI, Arial" font-size="11" fill="#58a6ff">React</text>
    <text x="400" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">TypeScript</text>
    <text x="400" y="120" font-family="Segoe UI, Arial" font-size="11" fill="#d2a8ff">Tailwind CSS</text>
    <text x="400" y="140" font-family="Segoe UI, Arial" font-size="11" fill="#f0883e">Next.js</text>
  </g>
  
  <!-- Live Preview -->
  <g transform="translate(30, 250)">
    <rect x="0" y="0" width="740" height="230" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="20" y="30" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">LIVE PREVIEW</text>
    
    <!-- Browser Frame -->
    <rect x="20" y="45" width="700" height="170" rx="6" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="45" width="700" height="25" fill="#30363d"/>
    <circle cx="40" cy="57" r="5" fill="#ff5f56"/>
    <circle cx="55" cy="57" r="5" fill="#ffbd2e"/>
    <circle cx="70" cy="57" r="5" fill="#27c93f"/>
    <text x="200" y="58" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">vishwanath-malusare.vercel.app</text>
    
    <!-- Website Content Preview -->
    <text x="200" y="100" font-family="Segoe UI, Arial" font-size="16" fill="#f0f6fc" text-anchor="middle">VISHWANATH MALUSARE</text>
    <text x="200" y="120" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e" text-anchor="middle">Professional Portfolio</text>
    <text x="200" y="140" font-family="Segoe UI, Arial" font-size="10" fill="#3fb950" text-anchor="middle">Built with React + TypeScript + Tailwind</text>
    
    <!-- Features -->
    <text x="400" y="90" font-family="Segoe UI, Arial" font-size="11" fill="#f0f6fc">Features:</text>
    <text x="400" y="110" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Responsive design</text>
    <text x="400" y="125" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Modern UI/UX</text>
    <text x="400" y="140" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Fast performance</text>
    <text x="400" y="155" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• SEO optimized</text>
    <text x="400" y="170" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">• Mobile-first approach</text>
    
    <text x="400" y="200" font-family="Segoe UI, Arial" font-size="10" fill="#58a6ff">✓ Deployed on Vercel</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>