<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="38" font-family="Segoe UI, Arial" font-size="22" fill="#f0f6fc" font-weight="bold">CODESHORTS BOT v2</text>
  <text x="280" y="38" font-family="Segoe UI, Arial" font-size="14" fill="#8b949e">YouTube Automation</text>
  
  <!-- Project Info -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="350" height="200" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="20" y="30" font-family="Segoe UI, Arial" font-size="14" fill="#ff0000" font-weight="bold">PROJECT OVERVIEW</text>
    
    <text x="20" y="60" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Name: CodeShorts Bot</text>
    <text x="20" y="80" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Type: Content Automation Tool</text>
    <text x="20" y="100" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Status: In Development</text>
    <text x="20" y="120" font-family="Segoe UI, Arial" font-size="12" fill="#8b949e">Purpose: Convert code to short-form content</text>
    
    <text x="20" y="150" font-family="Segoe UI, Arial" font-size="12" fill="#f0f6fc">Tech Stack:</text>
    <text x="20" y="170" font-family="Segoe UI, Arial" font-size="11" fill="#3572A5">Python</text>
    <text x="80" y="170" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">AI APIs</text>
    <text x="140" y="170" font-family="Segoe UI, Arial" font-size="11" fill="#d2a8ff">Automation</text>
    <text x="230" y="170" font-family="Segoe UI, Arial" font-size="11" fill="#ff0000">YouTube API</text>
  </g>
  
  <!-- Workflow -->
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="370" height="200" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="20" y="30" font-family="Segoe UI, Arial" font-size="14" fill="#58a6ff" font-weight="bold">AUTOMATION WORKFLOW</text>
    
    <rect x="20" y="45" width="330" height="30" rx="4" fill="#161b22"/>
    <text x="40" y="65" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">1. Script Generation</text>
    <text x="250" y="65" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">AI-powered</text>
    
    <rect x="20" y="80" width="330" height="30" rx="4" fill="#161b22"/>
    <text x="40" y="100" font-family="Segoe UI, Arial" font-size="11" fill="#58a6ff">2. Video Creation</text>
    <text x="250" y="100" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Automated</text>
    
    <rect x="20" y="115" width="330" height="30" rx="4" fill="#161b22"/>
    <text x="40" y="135" font-family="Segoe UI, Arial" font-size="11" fill="#d2a8ff">3. Formatting</text>
    <text x="250" y="135" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Platform-ready</text>
    
    <rect x="20" y="150" width="330" height="30" rx="4" fill="#161b22"/>
    <text x="40" y="170" font-family="Segoe UI, Arial" font-size="11" fill="#f0883e">4. Publishing</text>
    <text x="250" y="170" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Multi-platform</text>
  </g>
  
  <!-- Features -->
  <rect x="30" y="300" width="740" height="180" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="330" font-family="Segoe UI, Arial" font-size="14" fill="#f0f6fc" font-weight="bold">FEATURES</text>
  
  <g transform="translate(50, 350)">
    <text x="0" y="0" font-family="Segoe UI, Arial" font-size="11" fill="#3fb950">✓ AI Script Generation</text>
    <text x="0" y="20" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Automatically creates engaging scripts</text>
    
    <text x="0" y="45" font-family="Segoe UI, Arial" font-size="11" fill="#58a6ff">✓ Video Automation</text>
    <text x="0" y="65" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Converts code to visual content</text>
    
    <text x="350" y="0" font-family="Segoe UI, Arial" font-size="11" fill="#d2a8ff">✓ Multi-Platform Support</text>
    <text x="350" y="20" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Instagram, LinkedIn, YouTube Shorts</text>
    
    <text x="350" y="45" font-family="Segoe UI, Arial" font-size="11" fill="#f0883e">✓ Content Scheduling</text>
    <text x="350" y="65" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Plan and schedule posts</text>
    
    <text x="0" y="90" font-family="Segoe UI, Arial" font-size="11" fill="#f778ba">✓ Analytics Dashboard</text>
    <text x="0" y="110" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Track performance metrics</text>
    
    <text x="350" y="90" font-family="Segoe UI, Arial" font-size="11" fill="#ffd700">✓ Coming Soon</text>
    <text x="350" y="110" font-family="Segoe UI, Arial" font-size="10" fill="#8b949e">Full automation pipeline</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="490" width="800" height="10" fill="#21262d"/>
</svg>