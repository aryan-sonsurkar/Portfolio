<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffec80"/>
      <stop offset="100%" stop-color="#b8960c"/>
    </linearGradient>
    <linearGradient id="jerseyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- Ambient light effect -->
  <ellipse cx="200" cy="140" rx="160" ry="120" fill="#ffd700" opacity="0.03" filter="url(#softGlow)"/>

  <!-- Outer gold frame -->
  <rect x="30" y="20" width="340" height="260" rx="4" fill="none" stroke="url(#goldFrame)" stroke-width="4" filter="url(#glow)"/>
  <rect x="35" y="25" width="330" height="250" rx="2" fill="none" stroke="#b8960c" stroke-width="1"/>

  <!-- Inner frame glow -->
  <rect x="40" y="30" width="320" height="240" rx="2" fill="#0d1117" stroke="#ffd700" stroke-width="0.5" opacity="0.8"/>

  <!-- CR7 text at top -->
  <text x="200" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#ffd700" filter="url(#glow)">CR7</text>

  <!-- Decorative line under CR7 -->
  <line x1="160" y1="68" x2="240" y2="68" stroke="#ffd700" stroke-width="1" opacity="0.6"/>

  <!-- Jersey body -->
  <path d="M155,90 L145,100 L120,110 L110,130 L125,135 L145,120 L145,210 L255,210 L255,120 L275,135 L290,130 L280,110 L255,100 L245,90 L230,80 L200,75 L170,80 Z" fill="url(#jerseyGrad)" stroke="#cccccc" stroke-width="1"/>

  <!-- Jersey collar -->
  <path d="M170,80 L185,95 L200,88 L215,95 L230,80" fill="none" stroke="#cc0000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Red trim on sleeves -->
  <path d="M120,110 L110,130 L125,135" fill="none" stroke="#cc0000" stroke-width="2"/>
  <path d="M280,110 L290,130 L275,135" fill="none" stroke="#cc0000" stroke-width="2"/>

  <!-- Number 7 -->
  <text x="200" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="60" font-weight="bold" fill="#cc0000" filter="url(#glow)">7</text>

  <!-- Jersey side stripes -->
  <line x1="148" y1="100" x2="148" y2="210" stroke="#ffd700" stroke-width="1" opacity="0.4"/>
  <line x1="252" y1="100" x2="252" y2="210" stroke="#ffd700" stroke-width="1" opacity="0.4"/>

  <!-- RONALDO text at bottom -->
  <text x="200" y="240" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ffd700" letter-spacing="4" filter="url(#glow)">RONALDO</text>

  <!-- Subtle corner decorations -->
  <circle cx="40" cy="30" r="3" fill="#ffd700" opacity="0.7"/>
  <circle cx="360" cy="30" r="3" fill="#ffd700" opacity="0.7"/>
  <circle cx="40" cy="270" r="3" fill="#ffd700" opacity="0.7"/>
  <circle cx="360" cy="270" r="3" fill="#ffd700" opacity="0.7"/>
</svg>