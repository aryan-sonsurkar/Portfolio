<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffec80"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8960c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc6a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a24"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="150" rx="180" ry="120" fill="#00ff88" opacity="0.02" filter="url(#softGlow)"/>
  <ellipse cx="200" cy="100" rx="150" ry="80" fill="#ffd700" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Card border -->
  <rect x="20" y="20" width="360" height="260" rx="8" fill="url(#cardGrad)" stroke="#ffd700" stroke-width="1" opacity="0.8"/>
  <rect x="22" y="22" width="356" height="256" rx="7" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>

  <!-- Header background accent -->
  <rect x="22" y="22" width="356" height="55" rx="7" fill="#0d1117" opacity="0.8"/>
  <line x1="22" y1="77" x2="378" y2="77" stroke="#ffd700" stroke-width="0.5" opacity="0.3"/>

  <!-- Football icon -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
  <path d="M42,44 L50,40 L58,44 L56,52 L44,52 Z" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.5"/>
  <line x1="50" y1="40" x2="50" y2="36" stroke="#ffd700" stroke-width="0.8" opacity="0.5"/>
  <line x1="50" y1="64" x2="50" y2="60" stroke="#ffd700" stroke-width="0.8" opacity="0.5"/>

  <!-- WHY FOOTBALL? header -->
  <text x="220" y="48" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#ffd700" letter-spacing="3" filter="url(#glow)">WHY FOOTBALL?</text>

  <!-- Decorative line under header -->
  <line x1="130" y1="58" x2="310" y2="58" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <circle cx="130" cy="58" r="2" fill="#00ff88" opacity="0.7"/>
  <circle cx="310" cy="58" r="2" fill="#00ff88" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="200" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00ff88" opacity="0.6" letter-spacing="2">THE BEAUTIFUL GAME</text>

  <!-- Bullet points -->
  <!-- Point 1 -->
  <g transform="translate(45, 100)">
    <!-- Bullet diamond -->
    <polygon points="8,0 12,4 8,8 4,4" fill="#ffd700" filter="url(#glow)"/>
    <!-- Text -->
    <text x="24" y="6" font-family="'Courier New', monospace" font-size="12" fill="#e0e0e0">Balance between code and sport</text>
    <!-- Underline -->
    <line x1="24" y1="12" x2="310" y2="12" stroke="#ffd700" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Point 2 -->
  <g transform="translate(45, 140)">
    <!-- Bullet diamond -->
    <polygon points="8,0 12,4 8,8 4,4" fill="#00ff88" filter="url(#greenGlow)"/>
    <!-- Text -->
    <text x="24" y="6" font-family="'Courier New', monospace" font-size="12" fill="#e0e0e0">Ronaldo is the ultimate motivation</text>
    <!-- Ronaldo highlight -->
    <text x="24" y="6" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" opacity="0.3">Ronaldo</text>
    <!-- Underline -->
    <line x1="24" y1="12" x2="310" y2="12" stroke="#00ff88" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Point 3 -->
  <g transform="translate(45, 180)">
    <!-- Bullet diamond -->
    <polygon points="8,0 12,4 8,8 4,4" fill="#ffd700" filter="url(#glow)"/>
    <!-- Text -->
    <text x="24" y="6" font-family="'Courier New', monospace" font-size="12" fill="#e0e0e0">Talent without hard work is nothing</text>
    <!-- Underline -->
    <line x1="24" y1="12" x2="310" y2="12" stroke="#ffd700" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Point 4 -->
  <g transform="translate(45, 220)">
    <!-- Bullet diamond -->
    <polygon points="8,0 12,4 8,8 4,4" fill="#00ff88" filter="url(#greenGlow)"/>
    <!-- Text -->
    <text x="24" y="6" font-family="'Courier New', monospace" font-size="12" fill="#e0e0e0">Every great build needs a great break</text>
    <!-- Underline -->
    <line x1="24" y1="12" x2="310" y2="12" stroke="#00ff88" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Bottom decorative elements -->
  <!-- Decorative line -->
  <line x1="40" y1="255" x2="360" y2="255" stroke="#ffd700" stroke-width="0.5" opacity="0.2"/>

  <!-- Small football icons at bottom corners -->
  <circle cx="50" cy="265" r="6" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <path d="M46,262 L50,260 L54,262 L53,266 L47,266 Z" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.2"/>

  <circle cx="350" cy="265" r="6" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.3"/>
  <path d="M346,262 L350,260 L354,262 L353,266 L347,266 Z" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner accents -->
  <path d="M20,20 L35,20" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <path d="M20,20 L20,35" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <path d="M380,20 L365,20" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <path d="M380,20 L380,35" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <path d="M20,280 L35,280" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <path d="M20,280 L20,265" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <path d="M380,280 L365,280" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <path d="M380,280 L380,265" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

  <!-- Side accent dots -->
  <circle cx="30" cy="100" r="1.5" fill="#ffd700" opacity="0.4"/>
  <circle cx="30" cy="140" r="1.5" fill="#00ff88" opacity="0.4"/>
  <circle cx="30" cy="180" r="1.5" fill="#ffd700" opacity="0.4"/>
  <circle cx="30" cy="220" r="1.5" fill="#00ff88" opacity="0.4"/>
</svg>